# Pins for the releases (packaging/build_release.py, .github/workflows/release.yml).
# Every binary or data file a release is built from is fetched from a fixed URL and
# checked against the SHA-256 below.

[pixi-pack]
version = "0.7.11"

[pixi-pack.win-64]
pack_url = "https://github.com/Quantco/pixi-pack/releases/download/v0.7.11/pixi-pack-x86_64-pc-windows-msvc.exe"
pack_sha256 = "12dde5b363fb7c5fb6215e0747638b0486a0bd3f47ef653b23ce020bc1936263"
unpack_url = "https://github.com/Quantco/pixi-pack/releases/download/v0.7.11/pixi-unpack-x86_64-pc-windows-msvc.exe"
unpack_sha256 = "4b27cae647100dae4a321954461fe5863d25aa3eb9a919fb302f20509090bc72"

# static (musl) builds: pixi-unpack runs on a system without anything installed
[pixi-pack.linux-64]
pack_url = "https://github.com/Quantco/pixi-pack/releases/download/v0.7.11/pixi-pack-x86_64-unknown-linux-musl"
pack_sha256 = "4f2e6b70433c846974b9bd1356456335028afbe23f1fdf856ffa022ed691fc22"
unpack_url = "https://github.com/Quantco/pixi-pack/releases/download/v0.7.11/pixi-unpack-x86_64-unknown-linux-musl"
unpack_sha256 = "8191f586b734e634e2f1644e553dcb8e07718d0bafbfefb65c5e6e22b4d484b7"

[environment]
name = "cpu"          # pixi environment shipped in the releases (GPU: mskpipe setup gpu)
platforms = ["win-64", "linux-64"]

# Attachment atlas (CC BY-NC-SA 2.0 BE, derived from LHDL), a separately licensed asset of
# the GitHub release with this tag; made with packaging/make_atlas_zip.py and uploaded once:
#   gh release create atlas-lhdl-v4 dist\msk-pipe-atlas-lhdl-v4.zip --latest=false ...
[atlas]
tag = "atlas-lhdl-v4"
file = "msk-pipe-atlas-lhdl-v4.zip"
sha256 = "0fb9a27f9f33cf118cbc558dc602041c4859971e58b3c96a5018c203050c959c"
folder = "lhdl"       # unpacked into <release>/atlas/<folder>

# Muscle Wrapping 2.x demo (not part of the pipeline): prebuilt OsimMuscleGeneratorTool with
# OpenSim and an example input, a separately licensed asset of the GitHub release with this
# tag; made with packaging/make_mw2_demo_zip.py from a local MW2 build and uploaded once:
#   gh release create mw2-demo-v1 dist\msk-pipe-mw2-demo-v1-win64.zip --latest=false ...
[mw2_demo]
tag = "mw2-demo-v1"
file = "msk-pipe-mw2-demo-v1-win64.zip"
sha256 = "a7b6a1b8d24e495c649380305ae63031e1d22051a30b4b87aef01e61609c798f"

# Runtime DLLs of the demo from conda-forge (licence text in the package); they replace the
# copies of the MW2 build. MW2 is built with /openmp:llvm and imports libomp140.x86_64.dll,
# which Microsoft ships only as non-redistributable: the LLVM OpenMP runtime takes its name.
[[mw2_demo.conda]]
name = "vc14_runtime"
url = "https://conda.anaconda.org/conda-forge/win-64/vc14_runtime-14.51.36247-habf1de7_41.conda"
sha256 = "4e4cb599cdc41bf2109d1464c127b5bcbddf548ce3e322e612afb691338b48f8"
dlls = "Library/bin"
licence_file = "info/licenses/LICENSE.TXT"

[[mw2_demo.conda]]
name = "llvm-openmp"
url = "https://conda.anaconda.org/conda-forge/win-64/llvm-openmp-22.1.8-h4fa8253_3.conda"
sha256 = "36951e53e6e6f75d390d04bdd460ecd055ef7c4e2167bfdc12e310efe936378a"
dlls = "Library/bin"
licence_file = "info/licenses/openmp/LICENSE.TXT"
rename = { "libomp.dll" = "libomp140.x86_64.dll" }
