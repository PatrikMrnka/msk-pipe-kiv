# msk-pipe configuration
# Every key is optional; omitted keys use the defaults shown here.
# Schema version of this file. Options: 1
config_version: 1

runtime:
  # Compute device; 'auto' uses an NVIDIA GPU if available, otherwise CPU. Options: cpu | gpu | auto
  device: cpu
  # Max CPU threads; null = all cores.
  threads: null
  # Random seed for stochastic steps.
  seed: 0
  # Directory in which run folders are created.
  runs_dir: runs
  # Reuse step outputs whose inputs and settings are unchanged.
  cache: true
  # Keep intermediate outputs of all steps.
  keep_intermediate: true
  # Log verbosity. Options: DEBUG | INFO | WARNING | ERROR
  log_level: INFO

segmentation:
  # Source of pelvis and femur masks. Options: totalsegmentator | musclemap
  bones: totalsegmentator
  # Tibia/fibula source: 'ts_appendicular' = TotalSegmentator appendicular_bones (as BP; needs a free academic licence key), 'musclemap' = no key. Options: musclemap | ts_appendicular
  tibia_fibula: ts_appendicular
  # Source of muscle masks; TotalSegmentator provides only the gluteal muscles. Options: totalsegmentator | musclemap
  muscles: musclemap
  totalsegmentator:
    # Low-resolution 3 mm model (tasks total/total_mr); faster, not recommended for meshing.
    fast: false
    # Higher-order upsampling of the segmentation to the input grid (--higher_order_resampling): smooth instead of staircase masks; false = BP behaviour.
    higher_order_resampling: true
    # Predict only the structures the pipeline needs (tasks total/total_mr).
    roi_subset: true
    # Extra CLI arguments passed verbatim.
    extra_args: []
  musclemap:
    # Whole-body model version (e.g. '1.4'); null = version pinned by msk-pipe.
    model_version: null
    # Sliding-window overlap in percent; higher = slower, possibly more accurate (BP: 90).
    overlap: 90.0
    # Axial slices per inference chunk, or 'auto' (from free CPU/GPU memory).
    chunk_size: auto
    # Extra CLI arguments passed verbatim.
    extra_args: []

labelmap:
  bones:
    # Labels with fewer voxels are treated as missing.
    min_voxels: 2000
    # Morphological closing radius in mm (applied first, only into background); 0 disables.
    closing_radius_mm: 1.5
    # Morphological opening radius in mm (applied after hole filling); 0 disables.
    opening_radius_mm: 1.5
    # Fill internal cavities of each label (3D).
    fill_holes: true
    # Connected components smaller than this fraction of the largest are removed; 1 keeps only the largest, 0 keeps all.
    min_component_fraction: 1.0
  muscles:
    # Labels with fewer voxels are treated as missing.
    min_voxels: 1000
    # Morphological closing radius in mm (applied first, only into background); 0 disables.
    closing_radius_mm: 1.5
    # Morphological opening radius in mm (applied after hole filling); 0 disables.
    opening_radius_mm: 1.5
    # Fill internal cavities of each label (3D).
    fill_holes: true
    # Connected components smaller than this fraction of the largest are removed; 1 keeps only the largest, 0 keeps all.
    min_component_fraction: 1.0

mesh:
  bones:
    # Windowed sinc smoothing iterations; 0 disables smoothing.
    smooth_iterations: 40
    # Smoothing pass band; lower = stronger smoothing.
    passband: 0.01
    # Fraction of triangles removed by quadric decimation; 0 disables.
    target_reduction: 0.8
    # Surface parts smaller than this fraction of the largest part are removed; 1 keeps only the largest, 0 keeps all.
    min_component_fraction: 0.1
  muscles:
    # Windowed sinc smoothing iterations; 0 disables smoothing.
    smooth_iterations: 30
    # Smoothing pass band; lower = stronger smoothing.
    passband: 0.01
    # Fraction of triangles removed by quadric decimation; 0 disables.
    target_reduction: 0.8
    # Surface parts smaller than this fraction of the largest part are removed; 1 keeps only the largest, 0 keeps all.
    min_component_fraction: 0.1

skeleton:
  # Skeletal model generator. Options: pystaple
  backend: pystaple
  # Leg to model. Options: r | l
  side: r
  # Pelvis ACS algorithm. Options: STAPLE
  pelvis_algorithm: STAPLE
  # Femur ACS algorithm. Options: GIBOC-cylinder
  femur_algorithm: GIBOC-cylinder
  # Tibia ACS algorithm. Options: Kai2014
  tibia_algorithm: Kai2014
  # Joint definition scheme. Options: auto2020
  joint_definitions: auto2020
  # STAPLE convention: the tibia body geometry is tibia + fibula (as in BP).
  include_fibula: true
  # Subject mass in kg; sets segment masses and inertias (gait2392 ratios).
  body_mass: 64.0
  # Format of the model's visualization geometries. Options: obj | stl
  geometry_format: obj
  # Fraction of triangles kept in the visualization geometries (1 = all).
  geometry_reduction: 0.3
  # File name of the model (<model_name>.osim).
  model_name: bone_model

attachments:
  # Attachment method plugin (see `mskpipe plugins`).
  method: bone_registration
  # Atlas providing reference attachment areas.
  atlas: lhdl
  # Method-specific parameters, validated by the plugin. Omitted ones take the plugin defaults (see `mskpipe plugins`).
  params: {}

export:
  # Muscles exported for Muscle Wrapping 2.x, or 'all'.
  muscles: all
  # Muscles (without side suffix) not exported for Muscle Wrapping 2.x. Default: muscles whose insertion is reached through an unsegmented tendon or fascia running around a bony pulley or down to the tibia; their insertion cannot be placed on the segmented belly (reasons in export.json). [] exports all.
  exclude: [piriformis, obturator_internus, obturator_externus, tensor_fasciae_latae]
  # Fibres per muscle.
  num_of_lines: 100
  # Segments per fibre (points - 1).
  line_res: 15
  # Muscle decomposition method of Muscle Wrapping 2.x. Options: kukacka | hoang
  decomposition_method: kukacka
  # Luca2018viaPointsAlgorithm: weights of the two bones moving a fibre point. Options: InverseDistance | PositionOnFibreQuadraticSpline | PositionOnFibreSCurve
  bone_weights: InverseDistance
  # Pelvis body geometry = hip bones + sacrum (when segmented), so that sacral fibre ends are assigned to the pelvis.
  pelvis_with_sacrum: true
  # Rotate the child frame of joints that cannot reach the pose of the image (STAPLE 1-DOF knee) so that all bones are in that pose in the first frame; false = keep the STAPLE frames (residual reported).
  align_child_frames: true
  motion:
    # Coordinate swept by the motion and driving the muscle paths; null = hip_flexion_<side>.
    coordinate: null
    # Last value of the swept coordinate [deg].
    end_deg: 90.0
    # Step of the swept coordinate [deg].
    step_deg: 2.0
  # Let Muscle Wrapping write fibre lengths and moment arms (analysis/).
  muscle_analysis: true
  # Let Muscle Wrapping write fibres and muscle meshes per frame (fibres/).
  fibre_export: false
  # Repair muscle meshes Muscle Wrapping cannot use (extra components, orientation; holes, non-manifold edges and genus > 0 by remeshing the mask).
  repair: true
  # Largest morphological opening tried when remeshing a mask (1, 1.5, 2, 3 mm); cuts thin bridges, e.g. a sheet of muscle left next to a bone (genus > 0).
  repair_max_opening_mm: 3.0
  # Largest morphological closing tried when remeshing a mask (steps 1.5 mm); fills tunnels.
  repair_max_closing_mm: 6.0
  # A repaired muscle is accepted only if its volume changes by at most this fraction (an opening can erase thin muscles or cut off their ends).
  repair_max_volume_change: 0.05
  # An attachment outline that collapses when projected onto the muscle (missing tendon; Muscle Wrapping would crash) is replaced by the outline of a patch of the muscle surface of this radius [mm] around it (grown until it is a disc).
  inflate_radius_mm: 5.0
  # Muscles whose mesh fails the checks (and cannot be repaired): 'exclude' from the setup XML or 'keep' (written with a warning). Attachment outline checks are reported only and never exclude a muscle. Options: exclude | keep
  on_invalid: exclude
