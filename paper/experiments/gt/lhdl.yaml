  adductor_magnus_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M100_Adductor_Magnus-smooth.obj]}
  adductor_magnus_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M100_Adductor_Magnus-smooth.obj]}
  adductor_longus_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M101_Adductor_Longus-smooth.obj]}
  adductor_longus_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M101_Adductor_Longus-smooth.obj]}
  adductor_brevis_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M102-Adductor_Brevis-smooth.obj]}
  gracilis_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M103_Gracilis_smooth.obj]}
  gracilis_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M103_Gracilis_smooth.obj]}
  pectineus_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M104_Pectineus-smooth.obj]}
  pectineus_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M104_Pectineus-smooth.obj]}
  semimembranosus_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M105_Membranosus-smooth.obj]}
  semimembranosus_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M105_Semi-membranosus-smooth_N.obj],
                     note: "S032_L_M105_..._N used; S032_L_M109_Semi-membranosus is a duplicate (M109 = tibialis anterior)"}
  semitendinosus_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M106_Tendinosus-smooth.obj]}
  semitendinosus_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M106_Tendinosus_smooth.obj]}
  biceps_femoris_r: {kind: muscle, files: [lhdl_msf/surfaces/S032_R_M107_108_Biceps_cruralis-smooth.obj],
                    note: "GT = both heads, pipeline = long head (volume and gt2p not comparable)"}
  biceps_femoris_l: {kind: muscle, files: [lhdl_msf/surfaces/S032_L_M107_108_Biceps_crural-smooth.obj],
                    note: "GT = both heads, pipeline = long head (volume and gt2p not comparable)"}

# Attachment outlines of the LHDL atlas (dissection). On LHDL they measure the
# registration/projection error only (atlas = same donor). Not in the atlas: obturators
# left, vastus intermedius.
attachments_glob:
  Ori: lhdl_atlas/muscles/{muscle}/*_Ori.vtk
  Ins: lhdl_atlas/muscles/{muscle}/*_Ins.vtk
