  adductor_brevis_l: {kind: muscle, files: [Surf_L_M102_Adduct_Brev.obj]}
  gracilis_r: {kind: muscle, files: [Surf_R_M103_Gracilis.obj]}
  gracilis_l: {kind: muscle, files: [Surf_L_M103_Gracilis.obj]}
  pectineus_r: {kind: muscle, files: [Surf_R_M104_Pectin.obj]}
