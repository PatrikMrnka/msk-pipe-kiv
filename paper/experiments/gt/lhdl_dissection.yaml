  sartorius_r: {kind: muscle, files: [Surf_R_M098_Sartorius.obj]}
  sartorius_l: {kind: muscle, files: [Surf_L_M098_Sartorius.obj]}
  tensor_fasciae_latae_r: {kind: muscle, files: [Surf_R_M099_Tens_fasc_lat.obj]}
