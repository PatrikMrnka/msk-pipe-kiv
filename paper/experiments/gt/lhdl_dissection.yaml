# Second muscle reference of LHDL: muscle surfaces digitised during dissection
# (MuscleDataCollection, Surf_*). Coarse (~100 vertices) and open (no Dice), but independent
# of the MRI; biceps femoris = long head only (M108). Use the difference to lhdl.yaml as
# inter-reference variability. No obturators; gluteus minimus left only.
#
#   pixi run -e dev-cpu python tools/gt_compare.py --gt paper/experiments/gt/lhdl_dissection.yaml --check
dataset: LHDL_DISSECTION
root: ../../../data/reference-GT/lhdl_msf/surfaces
frame: ras
subjects: ["LHDL*"]
sample_points: 20000
voxel_mm: 0.75

structures:
  gluteus_maximus_r: {kind: muscle, files: [Surf_R_M081_Glut_Max.obj]}
  gluteus_maximus_l: {kind: muscle, files: [Surf_L_M081_Glut_Max.obj]}
  gluteus_medius_r: {kind: muscle, files: [Surf_R_M082_Glut_Med.obj]}
  gluteus_medius_l: {kind: muscle, files: [Surf_L_M082_Glut_Med.obj]}
  gluteus_minimus_l: {kind: muscle, files: [Surf_L_M083_Glut_Min.obj]}
  piriformis_r: {kind: muscle, files: [Surf_R_M084_Pyriform.obj]}
  piriformis_l: {kind: muscle, files: [Surf_L_M084_Pyriform.obj]}
  iliacus_r: {kind: muscle, files: [Surf_R_M091_Iliacus.obj]}
  iliacus_l: {kind: muscle, files: [Surf_L_M091_Iliacus.obj]}
  rectus_femoris_r: {kind: muscle, files: [Surf_R_M094_Rect_Fem*.obj]}
  rectus_femoris_l: {kind: muscle, files: [Surf_L_M094_Rect_Fem*.obj]}
  vastus_lateralis_r: {kind: muscle, files: [Surf_R_M095_Vast_Lat.obj]}
  vastus_lateralis_l: {kind: muscle, files: [Surf_L_M095_Vast_Lat.obj]}
  vastus_medialis_r: {kind: muscle, files: [Surf_R_M096_Vast_Med.obj]}
  vastus_medialis_l: {kind: muscle, files: [Surf_L_M096_Vast_Med.obj]}
  vastus_intermedius_r: {kind: muscle, files: [Surf_R_M097_Vast_Interm.obj]}
