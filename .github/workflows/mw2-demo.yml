name: Muscle Wrapping demo

# The Muscle Wrapping 2.x demo (release asset pinned in packaging/release.toml [mw2_demo]) on
# a clean Windows runner: download it, check bin/ and the licences, run the bundled example
# and a copy of it given as a run folder (path with spaces), verify fibres and analyses.
# Until the asset is uploaded and pinned (sha256 empty) only the pin is read.
# Make and upload the asset: packaging/make_mw2_demo_zip.py (docstring).

on:
  push:
    branches: [main]
    paths:
      - packaging/release.toml
      - packaging/make_mw2_demo_zip.py
      - "packaging/mw2_demo/**"
      - .github/workflows/mw2-demo.yml
  pull_request:
    paths:
      - packaging/release.toml
      - packaging/make_mw2_demo_zip.py
      - "packaging/mw2_demo/**"
      - .github/workflows/mw2-demo.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo:
    name: Demo on a clean Windows runner
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MW2_DEMO_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Download the pinned demo asset
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          pixi exec --spec python=3.11 python packaging/make_mw2_demo_zip.py fetch --out build/demo --allow-missing
          if ($LASTEXITCODE) { throw "fetch failed" }
          $zip = @(Get-ChildItem build/demo/*.zip -ErrorAction SilentlyContinue)
          "found=$($zip.Count -gt 0)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Unzip to a short path, check bin/ and the licences
        if: steps.fetch.outputs.found == 'true'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item build/demo/*.zip).FullName C:\d
          $root = (Get-ChildItem C:\d -Directory | Select-Object -First 1).FullName
          "DEMO=$root" >> $env:GITHUB_ENV
          pixi exec --spec python=3.11 python packaging/make_mw2_demo_zip.py check $root
          if ($LASTEXITCODE) { throw "check failed" }

      - name: Bundled example (clean PATH)
        if: steps.fetch.outputs.found == 'true'
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          call "%DEMO%\run_demo.cmd"
          if errorlevel 1 exit /b 1

      - name: Example as a run folder, paths with spaces (clean PATH)
        if: steps.fetch.outputs.found == 'true'
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          xcopy /e /i /q "%DEMO%\example" "C:\d\my run\06_mw2_input" > nul || exit /b 1
          call "%DEMO%\run_demo.cmd" "C:\d\my run" "C:\d\work dir"
          if errorlevel 1 exit /b 1

      - name: Verify fibres and analyses
        if: steps.fetch.outputs.found == 'true'
        shell: pwsh
        run: |
          foreach ($work in @("$env:DEMO\output\example", "C:\d\work dir")) {
            pixi exec --spec python=3.11 python packaging/make_mw2_demo_zip.py verify $work
            if ($LASTEXITCODE) { throw "verify failed: $work" }
          }

      - name: Muscle Wrapping log
        if: failure() && steps.fetch.outputs.found == 'true'
        shell: pwsh
        run: |
          Get-ChildItem C:\d -Recurse -Filter mw2*.log | ForEach-Object {
            "== $($_.FullName)"; Get-Content $_.FullName -Tail 80
          }
