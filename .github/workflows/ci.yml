name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs tags for the version
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: default
          locked: true
          cache: true
      - run: pixi run lint
      - run: pixi run test

  cpu-env:
    name: Pipeline environment (CPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: cpu
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Smoke test
        run: |
          pixi run -e cpu mskpipe --version
          pixi run -e cpu python -c "import torch, totalsegmentator, pystaple; print(torch.__version__)"
          pixi run -e cpu mm_segment --help
