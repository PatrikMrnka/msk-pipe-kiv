name: Release

# Tag vX.Y.Z on main -> Windows and Linux release on GitHub (GitLab: a tag pipeline +
# release job).
#   git tag -a v0.1.0 -m "msk-pipe 0.1.0"
#   git push origin v0.1.0
# "Run workflow" (workflow_dispatch) builds and tests the same packages and leaves them in
# the draft release "ci-<run id>" (gh release download ci-<id>; gh release delete ci-<id> --yes).
#
# The packages (~1 GB each) go from job to job through a draft release, not an Actions
# artifact: the artifact storage quota of a private repository is smaller than a package.
# The Windows build creates the draft, the Linux build adds its package to it. The tag run
# publishes its draft at the end, after both packages passed their tests; a failed tag run
# leaves the draft behind (delete it before tagging again).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIXI_VERSION: v0.81.0

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write  # draft release with the package
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.draft.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs: version from the tag
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Download pixi-pack and pixi-unpack (pinned)
        run: pixi exec --spec python=3.11 python packaging/build_release.py tools --out build/tools

      - name: Build wheels of non-wheel packages (mskpipe, MuscleMap, pystaple, sdists)
        run: pixi exec --spec python=3.11 --spec pip --spec pyyaml python packaging/build_release.py wheels --out build/wheels

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = pixi exec --spec python=3.11 python packaging/build_release.py version --wheels build/wheels
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the package version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "mskpipe $v"

      - name: Pack the cpu environment
        shell: pwsh
        run: |
          $inject = @(Get-ChildItem build/wheels/*.whl | ForEach-Object { "--inject"; $_.FullName })
          & build/tools/pixi-pack.exe --environment cpu --platform win-64 --ignore-pypi-non-wheel `
            --use-cache build/cache --output-file build/environment.tar @inject pixi.toml
          if ($LASTEXITCODE) { throw "pixi-pack failed" }
          "{0:N2} GiB" -f ((Get-Item build/environment.tar).Length / 1GB)

      - name: Unpack for checks (path length, licences)
        shell: pwsh
        run: |
          & build/tools/pixi-unpack.exe build/environment.tar -o build/test -e env -s cmd -q
          if ($LASTEXITCODE) { throw "pixi-unpack failed" }
          pixi exec --spec python=3.11 python packaging/build_release.py maxpath --root build/test --out build/maxpath.txt
          build/test/env/python.exe packaging/collect_licenses.py --prefix build/test/env --out build/licenses
          "unpacked: {0:N2} GiB" -f ((Get-ChildItem build/test -Recurse -File | Measure-Object Length -Sum).Sum / 1GB)

      - name: Attachment atlas (pinned release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # arrays built with += (an if-expression would turn a one-item array into a string,
          # and splatting a string passes its characters)
          $cmd = @("packaging/build_release.py", "atlas", "--out", "build/assets")
          if ($env:GITHUB_REF_TYPE -ne "tag") { $cmd += "--allow-missing" }
          pixi exec --spec python=3.11 python @cmd
          if ($LASTEXITCODE) { throw "atlas failed" }

      - name: Assemble release
        shell: pwsh
        run: |
          $atlas = @(Get-ChildItem build/assets/*.zip -ErrorAction SilentlyContinue | ForEach-Object { "--atlas"; $_.FullName })
          pixi exec --spec python=3.11 python packaging/build_release.py assemble `
            --version ${{ steps.version.outputs.version }} --pack build/environment.tar `
            --unpack build/tools/pixi-unpack.exe --licenses build/licenses `
            --maxpath build/maxpath.txt --runtime-from build/test/env --out dist @atlas
          if ($LASTEXITCODE) { throw "assemble failed" }

      - name: Draft release with the package
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $files = @(Get-ChildItem dist/* | ForEach-Object { $_.FullName })
          $drafts = @(gh release list --repo $repo --json tagName,isDraft | ConvertFrom-Json |
            Where-Object { $_.isDraft } | ForEach-Object { $_.tagName })
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $name = $env:GITHUB_REF_NAME
            # re-run after a failed tag run: replace its draft
            foreach ($t in $drafts | Where-Object { $_ -eq $name }) { gh release delete $t --repo $repo --yes }
            gh release create $name @files --repo $repo --draft --verify-tag `
              --title "msk-pipe $env:VERSION" --notes-file packaging/release_notes.md --generate-notes
          } else {
            $name = "ci-$env:GITHUB_RUN_ID"
            # keep only the newest test build
            foreach ($t in $drafts | Where-Object { $_ -like "ci-*" }) { gh release delete $t --repo $repo --yes }
            gh release create $name @files --repo $repo --draft --target $env:GITHUB_SHA `
              --title "msk-pipe $env:VERSION (test build)" `
              --notes "Test build of $env:GITHUB_SHA (run $env:GITHUB_RUN_ID), not a release."
          }
          if ($LASTEXITCODE) { throw "gh release create failed" }
          "release=$name" >> $env:GITHUB_OUTPUT

  smoke:
    name: Test on a clean Windows runner
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # a draft release is visible only with write access
    env:
      VERSION: ${{ needs.build.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7  # only for tools/skeleton_parity.py
      - name: Download the package from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.build.outputs.release }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE --repo $env:GITHUB_REPOSITORY `
            --pattern "msk-pipe-$env:VERSION-win64.zip" --dir dist
          if ($LASTEXITCODE) { throw "download failed" }
      - name: Unzip to a short path
        shell: pwsh
        run: |
          Expand-Archive "dist/msk-pipe-$env:VERSION-win64.zip" C:\r
          "MSKPIPE_ROOT=C:\r\msk-pipe-$env:VERSION" >> $env:GITHUB_ENV
      - name: Visual C++ runtime next to pixi-unpack (clean Windows has none)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:MSKPIPE_ROOT\bin\vcruntime140.dll")) { throw "bin\vcruntime140.dll missing" }
      - name: First start (unpacks the environment) and version
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          call "%MSKPIPE_ROOT%\mskpipe.cmd" --version > version.txt || exit /b 1
          type version.txt
          findstr /c:"mskpipe %VERSION%" version.txt || exit /b 1
      - name: CLI
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          call "%MSKPIPE_ROOT%\mskpipe.cmd" plugins || exit /b 1
          call "%MSKPIPE_ROOT%\mskpipe.cmd" device -d auto || exit /b 1
          call "%MSKPIPE_ROOT%\mskpipe.cmd" setup status -m ct
          call "%MSKPIPE_ROOT%\mskpipe.cmd" config show > nul || exit /b 1
      - name: Tools and libraries in the environment
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          set "PY=%MSKPIPE_ROOT%\env\python.exe"
          "%PY%" -c "import torch, torchvision, totalsegmentator, nnunetv2, pystaple, vtk, SimpleITK; from torchvision.ops import nms; print(torch.__version__, vtk.vtkVersion.GetVTKVersion())" || exit /b 1
          "%PY%" -c "import vtk; assert vtk.vtkVersion.GetVTKVersion() == '9.4.2'" || exit /b 1
          "%PY%" -m totalsegmentator.bin.TotalSegmentator --version || exit /b 1
          call "%MSKPIPE_ROOT%\activate.bat"
          mm_segment --help > nul || exit /b 1
          "%PY%" -c "from PySide6.QtWidgets import QApplication; import mskpipe.gui.app" || exit /b 1
      - name: Skeleton parity with MATLAB STAPLE
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          call "%MSKPIPE_ROOT%\env\..\activate.bat"
          "%MSKPIPE_ROOT%\env\python.exe" tools\skeleton_parity.py --fetch
      - name: Moved folder is unpacked again
        shell: pwsh
        run: |
          Move-Item C:\r C:\r2
          & "C:\r2\msk-pipe-$env:VERSION\mskpipe.cmd" --version
          if ($LASTEXITCODE) { throw "relocated release does not start" }

  build-linux:
    name: Build Linux package
    needs: build  # the draft release and the version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # adds the package to the draft release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE: ${{ needs.build.outputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs: version from the tag
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Download pixi-pack and pixi-unpack (pinned)
        run: pixi exec --spec python=3.11 python packaging/build_release.py tools --out build/tools

      - name: Build wheels of non-wheel packages (mskpipe, MuscleMap, pystaple, sdists)
        run: pixi exec --spec python=3.11 --spec pip --spec pyyaml python packaging/build_release.py wheels --out build/wheels

      - name: Version (the same as the Windows package)
        run: |
          v=$(pixi exec --spec python=3.11 python packaging/build_release.py version --wheels build/wheels)
          echo "mskpipe $v"
          [ "$v" = "$VERSION" ] || { echo "::error::Linux package $v, Windows package $VERSION"; exit 1; }

      - name: Pack the cpu environment
        run: |
          inject=()
          for wheel in build/wheels/*.whl; do inject+=(--inject "$wheel"); done
          build/tools/pixi-pack --environment cpu --platform linux-64 --ignore-pypi-non-wheel \
            --use-cache build/cache --output-file build/environment.tar "${inject[@]}" pixi.toml
          rm -rf build/cache  # the runner disk is small
          du -h build/environment.tar

      - name: Unpack for checks (licences, CA certificates)
        run: |
          build/tools/pixi-unpack build/environment.tar -o build/test -e env -s bash -q
          build/test/env/bin/python packaging/collect_licenses.py --prefix build/test/env --out build/licenses
          du -sh build/test

      - name: Attachment atlas (pinned release asset)
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then args+=(--allow-missing); fi
          pixi exec --spec python=3.11 python packaging/build_release.py atlas --out build/assets "${args[@]}"

      - name: Assemble release
        run: |
          atlas=()
          for zip in build/assets/*.zip; do
            if [ -e "$zip" ]; then atlas=(--atlas "$zip"); fi
          done
          pixi exec --spec python=3.11 python packaging/build_release.py assemble \
            --version "$VERSION" --pack build/environment.tar --unpack build/tools/pixi-unpack \
            --licenses build/licenses --runtime-from build/test/env --out dist "${atlas[@]}"

      - name: Add the package to the draft release
        run: |
          package="dist/msk-pipe-$VERSION-linux-x86_64.tar.gz"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir sums
          pixi exec --spec python=3.11 python packaging/build_release.py sums --file sums/SHA256SUMS.txt "$package"
          gh release upload "$RELEASE" "$package" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE" sums/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  smoke-linux:
    # In Docker images of Ubuntu, which have neither Python nor any graphics or X11
    # library: what packaging/linux/smoke_test.sh needs for the GUI it installs itself.
    name: Test on clean Ubuntu ${{ matrix.ubuntu }}
    needs: [build, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # a draft release is visible only with write access
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE: ${{ needs.build.outputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7  # smoke_test.sh and tools/skeleton_parity.py
      - name: Download the package from the draft release
        run: |
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "msk-pipe-$VERSION-linux-x86_64.tar.gz" --pattern SHA256SUMS.txt --dir dist
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS.txt)
      - name: Unpack
        run: |
          mkdir release
          tar -xzf "dist/msk-pipe-$VERSION-linux-x86_64.tar.gz" -C release
          rm -rf dist
          test -x "release/msk-pipe-$VERSION/mskpipe"
          test ! -e "release/msk-pipe-$VERSION/msk-pipe"  # command line only, no GUI launcher
      - name: Test in ubuntu:${{ matrix.ubuntu }}
        run: |
          docker run --rm -v "$PWD/release:/release" -v "$PWD:/repo:ro" "ubuntu:${{ matrix.ubuntu }}" \
            bash /repo/packaging/linux/smoke_test.sh "/release/msk-pipe-$VERSION" "$VERSION" /repo

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build, smoke, build-linux, smoke-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
